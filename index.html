<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#055120" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter em quatro pesos (400/500/600/700) para TODA a interface. O
         Infinify tem uma família só: sem face de display, sem segunda fonte
         para número — hierarquia vem de tamanho e peso, nunca de troca de
         fonte. JetBrains Mono é a única exceção e fica restrita a SKU e
         código, onde largura fixa é requisito de leitura, não estilo. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ReporIA — Reposição de estoque</title>
    <meta
      name="description"
      content="ReporIA: cálculo de estoque de segurança, ponto de pedido, estoque máximo e sugestão de compra por SKU."
    />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
